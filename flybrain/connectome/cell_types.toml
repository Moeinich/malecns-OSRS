# Cell types this project depends on, resolved by name from the MaleCNS v1.0
# annotations. `expect` is the cardinality verified against
# body-annotations-male-cns-v1.0-minconf-0.5.feather; a mismatch warns, and a
# missing `required` type is a hard error with no index fallback.
#
# match:
#   boundary (default) - the type plus annotator subtype splits (`DNa02_a`),
#                        but never a longer name (`Tm1` must not swallow `Tm12`)
#   prefix             - the whole family under a stem (`KC*`, `PAM*`)
#   exact              - this type alone

[DNp01]
required = true
expect = 2
role = "Giant Fiber, escape; a single spike is the whole readout"

[DNa02]
required = true
expect = 2
role = "the steering DN; L/R rate imbalance sets turn direction"

[DNpe017]
required = true
expect = 2
role = "locomotor drive"

[MDN]
required = true
expect = 4
role = "backward walking"

[DNp09]
required = true
expect = 2
role = "forward drive, pooled with DNb02"

[DNp20]
required = false
expect = 2
role = "FlyBrain's steering neuron, kept only for comparison"

[KC]
required = false
match = "prefix"
expect = 4064
role = "Kenyon cells, 15 subtypes; presynaptic half of the plastic KC-MBON set"

[MBON]
required = false
match = "prefix"
expect = 97
role = "mushroom body output; gates attack"

[PPL1]
required = false
match = "prefix"
expect = 16
role = "aversive dopamine; damage taken and death route here"

[PAM]
required = false
match = "prefix"
expect = 316
role = "appetitive dopamine; damage dealt, kills and XP route here"

[L1]
required = false
expect = 1776
role = "lamina ON pathway, 99% hex-mapped; a retina injection site"

[L2]
required = false
expect = 1779
role = "lamina OFF pathway, 99% hex-mapped; a retina injection site"

[L3]
required = false
expect = 1772
role = "lamina, only 50% hex-mapped"

[Tm1]
required = false
expect = 1777
role = "medulla OFF, 99% hex-mapped; a retina injection site"

[T4a]
required = false
match = "exact"
expect = 1684
role = "ON motion detector; 0% hex-mapped, so never inject here directly"

[T5a]
required = false
match = "exact"
expect = 1664
role = "OFF motion detector; 0% hex-mapped, so never inject here directly"
