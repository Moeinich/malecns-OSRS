[project]
name = "flybrain"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4",
    "scipy>=1.17",
    "pyarrow",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flybrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["vendor", "data"]
